AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Sample SAM Template for Stock Statistics Lambda

Parameters:
  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: Gemini API key

Globals:
  Function:
    Timeout: 30
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: "'*'"

Resources:
  StockStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/get_stock_stats/
      Handler: app.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      Events:
        GetStockStats:
          Type: Api
          Properties:
            Path: /stats
            Method: get

  GeminiPromptFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/gemini_prompt/
      Handler: app.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      Environment:
        Variables:
          GEMINI_API_KEY: !Ref GeminiApiKey
      Events:
        GeminiPrompt:
          Type: Api
          Properties:
            Path: /gemini
            Method: post

  SimulatePortfolioFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/simulate_portfolio/
      Handler: app.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      Timeout: 120
      Events:
        SimulatePortfolio:
          Type: Api
          Properties:
            Path: /simulate
            Method: post

  BacktestStrategyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/backtest_strategy/
      Handler: app.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      Timeout: 90
      Events:
        BacktestStrategy:
          Type: Api
          Properties:
            Path: /backtest
            Method: post

Outputs:
  ApiBaseUrl:
    Description: "Base URL for the deployed API -- this is what goes in VITE_API_BASE_URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"